server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BrowserRouter routes such as /phone/<pair-token> must resolve to the SPA
    # on a page refresh; API and upload paths never reach this container.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

